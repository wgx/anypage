<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anypage Editor</title>

    <!-- Using Tailwind CSS for a modern, utility-first approach -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts for a nicer typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        /* Using Inter as the default font */
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom styles for form inputs for a consistent look */
        .form-input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0.5rem 1rem;
            background-color: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 0.5rem;
            transition: box-shadow 0.2s ease-in-out, border-color 0.2s ease-in-out;
        }
        .form-input:focus {
            outline: none;
            border-color: transparent;
            box-shadow: 0 0 0 2px #3b82f6;
        }
        /* Simple transition for button feedback */
        .btn {
            transition: background-color 0.2s ease-in-out, transform 0.1s ease-in-out;
        }
        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800">

    <!-- Main container with responsive padding and max-width -->
    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-4xl min-h-screen flex flex-col">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl sm:text-5xl font-bold text-gray-900">Anypage Editor</h1>
            <p class="text-lg text-gray-600 mt-2">Create your own content-in-a-URL webpage.</p>
        </header>

        <!-- Main editor card -->
        <main class="bg-white p-6 sm:p-8 rounded-xl shadow-md flex-grow">
            <div class="space-y-6">
                <!-- H1 Input -->
                <div>
                    <label for="h1" class="block text-sm font-medium text-gray-700 mb-1">Title (h1)</label>
                    <input type="text" id="h1" class="form-input" placeholder="Your main page title">
                </div>
                
                <!-- H2 Input -->
                <div>
                    <label for="h2" class="block text-sm font-medium text-gray-700 mb-1">Subtitle (h2)</label>
                    <input type="text" id="h2" class="form-input" placeholder="A catchy subtitle">
                </div>

                <!-- Body Textarea -->
                <div>
                    <label for="body" class="block text-sm font-medium text-gray-700 mb-1">Body Content</label>
                    <textarea id="body" rows="8" class="form-input w-full" placeholder="Tell your story here. You can use line breaks."></textarea>
                </div>

                <!-- Footer Input -->
                <div>
                    <label for="footer" class="block text-sm font-medium text-gray-700 mb-1">Footer</label>
                    <input type="text" id="footer" class="form-input" placeholder="e.g., Created by Your Name">
                </div>
            </div>
        </main>

        <!-- Output and Actions Section -->
        <section class="bg-white mt-8 p-6 sm:p-8 rounded-xl shadow-md">
            <h2 class="text-2xl font-bold text-gray-900 mb-4">Your Anypage URL</h2>
            <p class="text-gray-600 mb-4">This URL contains all your content. Share it anywhere!</p>
            
            <!-- URL Display -->
            <div class="bg-gray-100 p-4 rounded-lg overflow-x-auto">
                <code id="output-url" class="text-sm text-gray-800 break-all"></code>
            </div>

            <!-- Action Buttons -->
            <div class="mt-6 flex flex-col sm:flex-row sm:justify-end sm:space-x-4 space-y-3 sm:space-y-0">
                <button id="copy-url-button" type="button" class="btn w-full sm:w-auto bg-blue-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-500">
                    Copy URL
                </button>
                <a id="preview-link" href="#" target="_blank" rel="noopener noreferrer" class="btn w-full sm:w-auto text-center bg-gray-800 text-white font-bold py-3 px-6 rounded-lg hover:bg-gray-700">
                    Preview
                </a>
            </div>
            <div id="copy-feedback" class="text-green-600 font-semibold mt-4 h-6 text-right" role="status" aria-live="polite"></div>
        </section>

    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {

    // --- DOM Element References ---
    const h1Input = document.getElementById('h1');
    const h2Input = document.getElementById('h2');
    const bodyInput = document.getElementById('body');
    const footerInput = document.getElementById('footer');
    const outputUrlEl = document.getElementById('output-url');
    const previewLinkEl = document.getElementById('preview-link');
    const copyFeedbackEl = document.getElementById('copy-feedback');

    document.getElementById('copy-url-button').addEventListener('click', copyUrlToClipboard);

    // --- The base URL for the Anypage viewer ---
    // This assumes the editor is in a sub-path or the same directory.
    // Adjust if your file structure is different.
    const editorUrl = new URL(window.location.href);
    editorUrl.search = '';
    editorUrl.hash = '';
    editorUrl.pathname = editorUrl.pathname.replace(/editor(?:\.html)?\/?$/, '');
    const baseUrl = editorUrl.href;


    /**
     * Gathers data, encodes it, and updates the output URL.
     */
    function updateUrl() {
        // 1. Create a data object from the form inputs.
        const content = {
            h1: h1Input.value || "Anypage Title", // Default values
            h2: h2Input.value || "Your content lives in the URL.",
            body: bodyInput.value || "This page was generated by the Anypage editor.",
            footer: footerInput.value,
        };

        // 2. Convert the object to a JSON string.
        const jsonString = JSON.stringify(content);

        // 3. Encode the JSON string into Base64.
        // This method correctly handles Unicode characters.
        const bytes = new TextEncoder().encode(jsonString);
        let binaryString = '';
        bytes.forEach(byte => {
            binaryString += String.fromCharCode(byte);
        });
        const base64String = btoa(binaryString);

        // 4. Construct the full URL.
        const finalUrl = `${baseUrl}?${base64String}`;

        // 5. Update the page with the new URL.
        outputUrlEl.textContent = finalUrl;
        previewLinkEl.href = finalUrl;
    }

    // --- Event Listeners ---
    // Add an 'input' event listener to each form element to update the URL in real-time.
    [h1Input, h2Input, bodyInput, footerInput].forEach(input => {
        input.addEventListener('input', updateUrl);
    });

    // --- Initial Call ---
    // Generate the initial URL when the page loads.
    updateUrl();
});

/**
 * Copies the generated URL from the output element to the clipboard.
 */
function copyUrlToClipboard() {
    const urlToCopy = document.getElementById('output-url').textContent;
    const copyFeedbackEl = document.getElementById('copy-feedback');

    if (!navigator.clipboard || typeof navigator.clipboard.writeText !== 'function') {
        showCopyFeedback('Clipboard access is unavailable.');
        return;
    }
    navigator.clipboard.writeText(urlToCopy).then(() => {
        copyFeedbackEl.textContent = 'URL copied to clipboard!';
        setTimeout(() => {
            copyFeedbackEl.textContent = '';
        }, 2500);
    }).catch(err => {
        console.error('Failed to copy URL: ', err);
        showCopyFeedback('Failed to copy!');
    });
}

function showCopyFeedback(message) {
    const copyFeedbackEl = document.getElementById('copy-feedback');
    copyFeedbackEl.textContent = message;
    copyFeedbackEl.style.color = 'red';
    setTimeout(() => {
        copyFeedbackEl.textContent = '';
        copyFeedbackEl.style.color = '';
    }, 2500);
}
</script>

</body>
</html>
